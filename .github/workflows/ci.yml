name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Lint (flake8)
        run: |
          flake8 . --count --max-line-length=110 --extend-ignore=E203,W503 \
            --exclude=artifacts,.venv

      - name: Run smoke tests
        run: pytest tests/ -v

      - name: Verify Streamlit app imports
        run: python -c "import ast; ast.parse(open('app.py').read())"

  streamlit-app-check:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Streamlit config sanity check
        run: |
          python -m streamlit config show > /dev/null
          echo "Streamlit installs and runs correctly."
